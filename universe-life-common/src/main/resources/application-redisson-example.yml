# Redisson配置示例
# 复制此配置到你的bootstrap.yaml或application.yml文件中

# 开发环境单机模式配置示例
universe-life:
  data:
    redisson:
      # Redis连接配置
      redis:
        host: localhost
        port: 6379
        password: ""
        database: 0
        timeout: 10000

      # 集群配置（单机模式保持默认）
      cluster:
        enabled: false
        nodes: ""
        readMode: "SLAVE"
        subscriptionMode: "SLAVE"

      # 线程池配置（开发环境可适当调小）
      threadPool:
        threadPoolSize: 32
        nettyThreads: 16

      # 超时配置
      timeout:
        heartbeatInterval: 30000
        idleConnectionTimeout: 10000
        connectTimeout: 10000
        timeout: 3000
        pingConnectionInterval: 30000
        pingTimeout: 3000

      # 重试配置
      retry:
        attempts: 3
        interval: 1500
        reconnectionTimeout: 10000
        failedSlaveReconnectionInterval: 3000
        failedSlaveCheckInterval: 180000
        minBackoffPeriod: 500
        maxBackoffPeriod: 1500

      # 订阅配置
      subscription:
        subscriptionsPerConnection: 5
        connectionMinimumIdleSize: 1
        connectionPoolSize: 20

      # 连接池配置（开发环境可适当调小）
      connectionPool:
        connectionMinimumIdleSize: 8
        connectionPoolSize: 20
        dnsMonitoringInterval: 5000

      # 高级配置
      advanced:
        lockWatchdogTimeout: 30000
        keepPubSubOrder: true
        useScriptCache: true
        transportMode: "NIO"

---

# 生产环境集群模式配置示例
# 将以下配置复制到生产环境配置文件中，并根据实际情况调整参数

universe-life:
  data:
    redisson:
      # Redis连接配置
      redis:
        host: localhost          # 集群模式下此配置可忽略，但建议保留作为备用
        port: 6379
        password: "your_redis_password"
        database: 0
        timeout: 10000

      # 集群配置
      cluster:
        enabled: true
        nodes: "192.168.1.100:6379,192.168.1.101:6379,192.168.1.102:6379,192.168.1.103:6379,192.168.1.104:6379,192.168.1.105:6379"
        readMode: "SLAVE"        # 生产环境建议使用SLAVE模式，从主节点读取
        subscriptionMode: "SLAVE"

      # 线程池配置（生产环境适当调大）
      threadPool:
        threadPoolSize: 64
        nettyThreads: 32

      # 超时配置
      timeout:
        heartbeatInterval: 30000
        idleConnectionTimeout: 10000
        connectTimeout: 10000
        timeout: 5000            # 生产环境可适当增加超时时间
        pingConnectionInterval: 30000
        pingTimeout: 5000

      # 重试配置
      retry:
        attempts: 3
        interval: 1500
        reconnectionTimeout: 10000
        failedSlaveReconnectionInterval: 3000
        failedSlaveCheckInterval: 180000
        minBackoffPeriod: 500
        maxBackoffPeriod: 1500

      # 订阅配置
      subscription:
        subscriptionsPerConnection: 5
        connectionMinimumIdleSize: 1
        connectionPoolSize: 50

      # 连接池配置（生产环境适当调大）
      connectionPool:
        connectionMinimumIdleSize: 24
        connectionPoolSize: 64
        dnsMonitoringInterval: 5000

      # 高级配置
      advanced:
        lockWatchdogTimeout: 30000
        keepPubSubOrder: true
        useScriptCache: true
        transportMode: "NIO"        # Linux环境可使用"EPOLL"获得更好性能