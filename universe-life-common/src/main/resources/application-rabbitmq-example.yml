# RabbitMQ Spring Boot 配置示例
# 这个文件展示了如何在Spring Boot中配置RabbitMQ

spring:
  # RabbitMQ基础配置
  rabbitmq:
    # 连接信息
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

    # 连接池配置
    connection-timeout: 15000  # 连接超时（毫秒）
    publisher-confirm-type: correlated  # 发布确认模式
    publisher-returns: true  # 启用发布返回
    template:
      retry:
        enabled: true  # 启用重试
        initial-interval: 1000  # 初始重试间隔（毫秒）
        max-attempts: 3  # 最大重试次数
        max-interval: 10000  # 最大重试间隔（毫秒）
        multiplier: 2  # 重试间隔倍数

    # 监听器配置
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认模式
        retry:
          enabled: true  # 启用消费重试
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2
        default-requeue-rejected: false  # 重试失败后不重新入队
        prefetch: 1  # 预取数量
        concurrency: 1  # 消费者数量
        max-concurrency: 5  # 最大消费者数量

# 日志配置
logging:
  level:
    org.springframework.amqp: DEBUG
    com.universe.life.common.util: DEBUG

# 自定义RabbitMQ配置
universe:
  rabbitmq:
    # 队列配置
    queues:
      basic:
        name: basic.queue
        durable: true
      priority:
        name: priority.queue
        durable: true
        max-priority: 10
      ttl:
        name: ttl.queue
        durable: true
        message-ttl: 60000  # 60秒

    # 交换机配置
    exchanges:
      direct:
        name: direct.exchange
        type: direct
        durable: true
      topic:
        name: topic.exchange
        type: topic
        durable: true
      fanout:
        name: fanout.exchange
        type: fanout
        durable: true

    # 死信队列配置
    dead-letter:
      main-queue: main.queue
      dead-letter-queue: dead.letter.queue
      dead-letter-exchange: dead.letter.exchange
      dead-letter-routing-key: dead.letter.routing.key

    # 延迟队列配置
    delay:
      delay-queue: delay.queue
      target-queue: target.queue
      delay-exchange: delay.exchange
      target-exchange: target.exchange
      routing-key: delay.routing.key
      delay-ttl: 5000  # 5秒

# 使用说明：
#
# 1. 基础配置：
#    - spring.rabbitmq.* 是Spring Boot的标准配置项
#    - 包含连接信息、连接池、发布确认、重试等配置
#
# 2. 监听器配置：
#    - acknowledge-mode: manual（推荐手动确认）
#    - prefetch: 控制消费者预取消息数量
#    - concurrency: 设置消费者并发数
#
# 3. 高级功能：
#    - 发布确认（publisher-confirm-type）
#    - 发布返回（publisher-returns）
#    - 消费重试（listener.simple.retry）
#
# 4. 自定义配置：
#    - universe.rabbitmq.* 是项目自定义配置
#    - 用于配置队列、交换机、死信队列等
#
# 5. 注意事项：
#    - 生产环境请修改默认用户名密码
#    - 根据业务需求调整prefetch和concurrency
#    - 延迟队列需要安装rabbitmq_delayed_message_exchange插件
#    - 建议启用发布确认和返回来确保消息可靠投递