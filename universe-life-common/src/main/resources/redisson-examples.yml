# Redisson多层次配置示例
# 支持独立的模式控制和Bean注册

# Redisson总开关
spring:
  redis:
    redisson:
      enabled: true  # 是否启用Redisson自动配置

# Redisson核心配置
universe-life:
  redisson:
    # 基础配置（所有模式共享）
    password: "1010520mao"        # Redis连接密码
    connectionPoolSize: 64        # 连接池大小
    connectTimeout: 10000         # 连接超时时间（毫秒）
    timeout: 3000                  # 命令执行超时时间（毫秒）
    retryAttempts: 3               # 重试次数
    retryInterval: 1500            # 重试间隔时间（毫秒）
    readMode: "SLAVE"              # 读取模式（集群/主从/哨兵）
    subscriptionMode: "MASTER"    # 订阅模式（集群/主从/哨兵）

    # -----------------------------------------------------------------------
    # 单机模式配置（默认启用）
    # -----------------------------------------------------------------------
    single:
      enabled: true                # 是否启用单机模式
      address: "redis://localhost:16379"  # Redis地址
      database: 0                   # 数据库编号

    # -----------------------------------------------------------------------
    # 集群模式配置
    # -----------------------------------------------------------------------
    cluster:
      enabled: false               # 是否启用集群模式
      nodes: []                     # 集群节点地址列表
      # nodes:
      #   - redis://node1:16379
      #   - redis://node2:16379
      #   - redis://node3:16379
      scanInterval: 2000            # 集群扫描间隔（毫秒）

    # -----------------------------------------------------------------------
    # 主从模式配置
    # -----------------------------------------------------------------------
    master-slave:
      enabled: false               # 是否启用主从模式
      masterAddress: null          # 主节点地址
      # masterAddress: "redis://master:16379"
      slaveAddresses: []            # 从节点地址列表
      # slaveAddresses:
      #   - redis://slave1:16379
      #   - redis://slave2:16379

    # -----------------------------------------------------------------------
    # 哨兵模式配置
    # -----------------------------------------------------------------------
    sentinel:
      enabled: false               # 是否启用哨兵模式
      sentinelAddresses: []        # 哨兵地址列表
      # sentinelAddresses:
      #   - redis://sentinel1:26379
      #   - redis://sentinel2:26379
      #   - redis://sentinel3:26379
      masterName: null              # 哨兵主服务名称
      # masterName: "mymaster"

# -----------------------------------------------------------------------
# 实际使用示例
# -----------------------------------------------------------------------

# 示例1: 开发环境单机模式（默认配置）
# universe-life:
#   redisson:
#     single:
#       enabled: true
#       address: "redis://localhost:16379"
#       database: 0
#     password: "dev-password"

# 示例2: 生产环境集群模式
# universe-life:
#   redisson:
#     password: "prod-password"
#     connectionPoolSize: 128
#     cluster:
#       enabled: true
#       nodes:
#         - redis://redis-cluster-1:16379
#         - redis://redis-cluster-2:16379
#         - redis://redis-cluster-3:16379
#       scanInterval: 1000
#     readMode: "SLAVE"

# 示例3: 主从模式架构
# universe-life:
#   redisson:
#     password: "master-slave-password"
#     master-slave:
#       enabled: true
#       masterAddress: "redis://redis-master:16379"
#       slaveAddresses:
#         - redis://redis-slave1:16379
#         - redis://redis-slave2:16379
#     readMode: "SLAVE"

# 示例4: 哨兵高可用架构
# universe-life:
#   redisson:
#     password: "sentinel-password"
#     sentinel:
#       enabled: true
#       sentinelAddresses:
#         - redis://sentinel1:26379
#         - redis://sentinel2:26379
#         - redis://sentinel3:26379
#       masterName: "mymaster"

# 示例5: 同时启用多个模式（用于测试或特殊场景）
# universe-life:
#   redisson:
#     single:
#       enabled: true
#       address: "redis://localhost:16379"
#     cluster:
#       enabled: true
#       nodes:
#         - redis://node1:16379
#         - redis://node2:16379
#     master-slave:
#       enabled: true
#       masterAddress: "redis://master:16379"
#       slaveAddresses:
#         - redis://slave1:16379

# -----------------------------------------------------------------------
# Bean注册说明
# -----------------------------------------------------------------------

# 唯一Bean（redissonClient）:
#    - 根据enabled配置自动选择模式
#    - 优先级: cluster > master-slave > sentinel > single
#    - 简单注入: @Autowired private RedissonClient redissonClient;

# 条件注册:
#    - 使用@ConditionalOnProperty控制Bean注册
#    - 只有enabled=true时才注册对应模式
#    - 使用@ConditionalOnMissingBean避免重复注册

# -----------------------------------------------------------------------
# 代码使用示例
# -----------------------------------------------------------------------

# 注入RedissonClient（自动选择模式）
# @Autowired
# private RedissonClient redissonClient;

# 使用工具类
# @Autowired
# private RedissonUtil redissonUtil;

# -----------------------------------------------------------------------
# 配置前缀说明
# -----------------------------------------------------------------------

# 1. 基础配置: universe-life.redisson.*
# 2. 单机配置: universe-life.redisson.single.*
# 3. 集群配置: universe-life.redisson.cluster.*
# 4. 主从配置: universe-life.redisson.master-slave.*
# 5. 哨兵配置: universe-life.redisson.sentinel.*

# -----------------------------------------------------------------------
# 最佳实践建议
# -----------------------------------------------------------------------

# 1. 生产环境建议只启用一种模式
# 2. 使用明确的enabled控制，避免自动选择的不确定性
# 3. 为不同环境创建不同的配置文件
# 4. 敏感信息（如密码）建议使用环境变量或外部配置
# 5. 在配置文件中添加详细的注释说明