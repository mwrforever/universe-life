# RabbitMQ 高级配置示例
# 展示如何使用自定义的universe.rabbitmq配置

spring:
  # RabbitMQ 基础配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

    # 连接配置
    connection-timeout: 15000
    publisher-confirm-type: correlated
    publisher-returns: true

    # 发送者配置
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2

    # 监听器配置
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2
        default-requeue-rejected: false
        prefetch: 1
        concurrency: 1
        max-concurrency: 5

# 自定义RabbitMQ配置
universe:
  rabbitmq:
    # 队列配置
    queues:
      # 基础队列
      basic:
        name: universe.basic.queue
        durable: true
        exclusive: false
        auto-delete: false

      # 优先级队列
      priority:
        name: universe.priority.queue
        durable: true
        exclusive: false
        auto-delete: false
        arguments:
          max-priority: 10
          x-max-length: 10000

      # TTL队列
      ttl:
        name: universe.ttl.queue
        durable: true
        exclusive: false
        auto-delete: false
        arguments:
          message-ttl: 60000  # 60秒TTL
          x-dead-letter-exchange: universe.dlx.exchange
          x-dead-letter-routing-key: dead.letter

      # 延迟队列目标
      delay-target:
        name: universe.delay.target.queue
        durable: true
        exclusive: false
        auto-delete: false

    # 交换机配置
    exchanges:
      # 直连交换机
      direct:
        name: universe.direct.exchange
        type: direct
        durable: true
        auto-delete: false

      # 主题交换机
      topic:
        name: universe.topic.exchange
        type: topic
        durable: true
        auto-delete: false

      # 扇出交换机
      fanout:
        name: universe.fanout.exchange
        type: fanout
        durable: true
        auto-delete: false

      # 延迟交换机
      delayed:
        name: universe.delayed.exchange
        type: x-delayed-message
        durable: true
        auto-delete: false
        arguments:
          x-delayed-type: direct

      # 死信交换机
      dead-letter:
        name: universe.dlx.exchange
        type: direct
        durable: true
        auto-delete: false

    # 死信队列配置
    dead-letter:
      main-queue: universe.main.queue
      dead-letter-queue: universe.dead.letter.queue
      dead-letter-exchange: universe.dlx.exchange
      dead-letter-routing-key: dead.letter.routing.key

    # 延迟队列配置
    delay:
      delay-queue: universe.delay.queue
      target-queue: universe.delay.target.queue
      delay-exchange: universe.delayed.exchange
      target-exchange: universe.direct.exchange
      routing-key: delay.routing.key
      delay-ttl: 5000  # 5秒

    # 默认配置
    default-config:
      max-retry-attempts: 3
      retry-interval: 1000
      default-ttl: 60000
      default-prefetch: 1
      default-concurrency: 1
      max-concurrency: 5

# 日志配置
logging:
  level:
    org.springframework.amqp: INFO
    com.universe.life.common.util: INFO
    com.universe.life.common.config: INFO

# 使用说明：
# 1. 这个配置文件展示了完整的RabbitMQ高级功能配置
# 2. 可以通过 @ConfigurationProperties 自动注入到 RabbitMqConfigProperties
# 3. 支持队列、交换机、死信队列、延迟队列的自动创建
# 4. 可以通过 RabbitMqAdvancedUtil.autoConfigureAdvancedQueues() 自动配置
#
# 使用示例：
# ```java
# @SpringBootApplication
# public class Application {
#     public static void main(String[] args) {
#         SpringApplication.run(Application.class);
#     }
#
#     @Bean
#     public CommandLineRunner demo(RabbitMqAdvancedUtil advancedUtil) {
#         return args -> {
#             // 自动配置高级队列
#             advancedUtil.autoConfigureAdvancedQueues();
#         };
#     }
# }
# ```