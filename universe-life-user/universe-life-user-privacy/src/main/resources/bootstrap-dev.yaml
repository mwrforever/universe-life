universe-life:
  datasource:
    host: localhost
    port: 13306
    username: root
    password: 1010520mao
    database: universe_life_user
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: 1
      host: localhost
      port: 16379
      password: 1010520mao
      timeout: 10000
  auth:
    enable: true
    exclude-path:
      - /auth/user/login
      - /auth/user/register
      - /auth/admin/login
      - /auth/admin/register
      - /v3/api-docs/**
      - /swagger-ui/**
      - /doc.html
  springdoc:
    packages-to-scan: com.universe.life.user
  # Redisson 分布式锁配置（测试环境）
  redisson:
    # 基础配置
    password: 1010520mao
    connection-pool-size: 30
    connect-timeout: 8000
    timeout: 2500
    retry-attempts: 2
    retry-interval: 1000
    read-mode: MASTER
    subscription-mode: MASTER

    # 单机模式配置（测试环境推荐）
    single:
      enabled: true
      address: redis://localhost:16379
      database: 1
  mybatis-plus:
    type-aliases-package: com.universe.life.user.privacy.domain

logging:
  level:
    org.springframework.amqp: INFO
    com.rabbitmq.client: INFO
    com.universe.life.user.privacy: DEBUG