# Test Configuration for Chat Service
spring:
  application:
    name: universe-life-chat-test

  # Redis - mock for tests
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka - disabled for unit tests
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: test-group
      auto-offset-reset: earliest

  # Disable Nacos for tests
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# Chat Service Configuration
chat:
  server:
    address: localhost:8105
    max-connections: 100

  kafka:
    topic:
      message: chat-message
      broadcast: chat-broadcast
      persistence: chat-persistence
      dead-letter: chat-dead-letter

  ratelimit:
    private:
      rate: 10
      capacity: 20
    group:
      rate: 5
      capacity: 10
    room:
      rate: 3
      capacity: 6

  sensitive-word:
    file-path: sensitive-words.txt
    use-redis: false

# Disable auth for tests
auth:
  enable: false

# Logging
logging:
  level:
    com.universe.life.chat: DEBUG
