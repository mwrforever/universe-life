# RabbitMQ 优化配置文件
# 将此配置文件添加到你的 Spring Boot 应用中以启用 RabbitMQ 优化功能

spring:
  # ====== RabbitMQ 核心配置 ======
  rabbitmq:
    # 基础连接配置
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s           # TCP 连接超时
    requested-heartbeat: 30s         # 心跳保活

    # ====== 生产者可靠性配置 ======
    publisher-confirm-type: correlated   # 开启发布确认（correlated 异步回调）
    publisher-returns: true              # 开启返回回调（路由失败时触发）
    template:
      mandatory: true                    # 必须路由到队列，否则触发 ReturnsCallback
      retry:
        enabled: true                    # 开启发送重试
        max-attempts: 3                  # 最大重试次数
        initial-interval: 1000ms         # 初始重试间隔
        max-interval: 10000ms            # 最大重试间隔
        multiplier: 2.0                  # 间隔倍数

    # ====== 消费者并发配置 ======
    listener:
      simple:
        # 默认配置
        concurrency: 5           # 最小消费者线程
        max-concurrency: 10      # 最大消费者线程
        prefetch: 50             # 每个线程预取 50 条
        acknowledge-mode: manual # 手动 ACK（业务处理完才 basicAck）
        default-requeue-rejected: false   # 异常时不重新入队，直接进 DLX

        # 重试配置
        retry:
          enabled: true
          max-attempts: 5                    # 最大重试次数
          initial-interval: 2000ms           # 初始重试间隔
          max-interval: 60000ms              # 最大重试间隔
          multiplier: 2.0                    # 间隔倍数

        # 死信配置
        default-dead-letter-receive-exchange: universe.life.dlx.exchange
        default-dead-letter-receive-routing-key: failed.message

    # ====== 缓存配置 ======
    cache:
      connection:
        mode: channel                    # 连接缓存模式
        size: 50                         # 连接池大小
      channel:
        size: 100                        # 通道池大小
        checkout-timeout: 30s            # 通道获取超时

    # ====== SSL 配置（生产环境推荐） ======
    # ssl:
    #   enabled: true
    #   key-store: classpath:keystore.p12
    #   key-store-password: ${SSL_KEYSTORE_PASSWORD}
    #   key-store-type: PKCS12
    #   trust-store: classpath:truststore.jks
    #   trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
    #   algorithm: TLSv1.2
    #   verify-hostname: true

  # ====== JSON 序列化配置 ======
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# ====== 日志配置 ======
logging:
  level:
    org.springframework.amqp: INFO
    com.rabbitmq.client: INFO
    com.universe.life.rabbitmq: DEBUG

  # RabbitMQ 相关日志文件
  file:
    name: logs/rabbitmq.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# ====== 管理端点配置 ======
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      rabbit:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ====== 自定义配置 ======
universe:
  life:
    rabbitmq:
      # ====== 功能开关 ======
      enabled: true
      async-sender: true
      health-check: true
      message-deduplication: true

      # ====== 性能配置 ======
      async-sender-pool-size: 10
      max-retry-count: 5
      message-ttl-default: 300000  # 5分钟

      # ====== 监控配置 ======
      metrics-enabled: true
      statistics-reset-interval: 3600000  # 1小时重置一次统计

      # ====== 告警配置 ======
      alert:
        enabled: true
        failure-rate-threshold: 0.1      # 失败率超过10%告警
        queue-depth-threshold: 1000      # 队列深度超过1000告警
        connection-failure-threshold: 3   # 连续失败3次告警

      # ====== 消息去重配置 ======
      deduplication:
        enabled: true
        cache-type: redis                 # 使用 Redis 缓存
        cache-ttl: 86400000              # 24小时
        max-cache-size: 1000000          # 最大缓存100万条

      # ====== 死信处理配置 ======
      dead-letter:
        enabled: true
        retry-enabled: true
        max-retry-attempts: 3
        retry-delay: 60000               # 1分钟后重试

        # 死信处理策略
        strategy:
          - type: log                     # 记录日志
          - type: alert                   # 发送告警
          - type: manual                  # 人工处理

# ====== 示例应用配置 ======
rabbitmq:
  example:
    enabled: false                      # 示例开关，生产环境设为 false

# ====== Redis 配置（用于消息去重和缓存） ======
spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3s
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 5
        max-wait: 3s

# ====== 数据源配置（用于死信消息存储） ======
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:universe_life}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

# ====== MyBatis Plus 配置 ======
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ====== 线程池配置 ======
spring:
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000
        keep-alive: 60s
      thread-name-prefix: rabbitmq-async-
    scheduling:
      pool:
        size: 5
      thread-name-prefix: rabbitmq-scheduler-

# ====== 环境特定配置 ======
---
spring:
  config:
    activate:
      on-profile: dev

universe:
  life:
    rabbitmq:
      alert:
        enabled: false      # 开发环境关闭告警
      deduplication:
        enabled: false      # 开发环境关闭去重

---
spring:
  config:
    activate:
      on-profile: test

universe:
  life:
    rabbitmq:
      async-sender-pool-size: 5
      max-retry-count: 3

---
spring:
  config:
    activate:
      on-profile: prod

universe:
  life:
    rabbitmq:
      async-sender-pool-size: 20
      max-retry-count: 10
      alert:
        enabled: true
        failure-rate-threshold: 0.05     # 生产环境更严格的阈值
        queue-depth-threshold: 500

spring:
  rabbitmq:
    # 生产环境建议使用集群地址
    addresses: ${RABBITMQ_ADDRESSES}
    ssl:
      enabled: true
      key-store: classpath:keystore.p12
      key-store-password: ${SSL_KEYSTORE_PASSWORD}
      trust-store: classpath:truststore.jks
      trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}

logging:
  level:
    com.universe.life.rabbitmq: INFO