server:
  port: 8102
spring:
  profiles:
    active: dev
  application:
    name: notify-service
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: localhost:6848
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: 3c085602-c7a2-4095-8ca3-c53bba163e0f
        username: ${NACOS_ACCOUNT:nacos}
        password: ${NACOS_PASSWORD:nacos}
        shared-configs:
          - data-id: shared-datasource.yaml
            refresh: true
          - data-id: shared-redis.yaml
            refresh: true
          - data-id: shared-mybatis-plus.yaml
            refresh: true
          - data-id: shared-powerjob.yaml
            refresh: true
          - data-id: shared-jackson.yaml
            refresh: true
          - data-id: shared-rabbitmq.yaml
            refresh: true
          - data-id: shared-server-springdoc.yaml
            refresh: true
      discovery:
        server-addr: localhost:6848          # Nacos 注册中心地址
        namespace: 3c085602-c7a2-4095-8ca3-c53bba163e0f
        group: DEFAULT_GROUP
        username: ${NACOS_ACCOUNT:nacos}
        password: ${NACOS_PASSWORD:nacos}

