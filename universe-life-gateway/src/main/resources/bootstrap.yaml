server:
  port: 8091
spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: localhost:6848
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: a40a1d4b-4110-45e7-b16d-dc842e7ba324
        username: ${NACOS_ACCOUNT:nacos}
        password: ${NACOS_PASSWORD:nacos}
        shared-configs:
          - data-id: shared-routes.yaml
            refresh: true
          - data-id: shared-logging.yaml
            refresh: true
      discovery:
        enabled: true
        server-addr: localhost:6848
        namespace: a40a1d4b-4110-45e7-b16d-dc842e7ba324
        group: DEFAULT_GROUP
        username: ${NACOS_ACCOUNT:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - http://localhost:3000
              - http://127.0.0.1:8084
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600