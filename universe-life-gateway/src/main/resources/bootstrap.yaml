server:
  port: 8101
spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: localhost:6848
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: 3c085602-c7a2-4095-8ca3-c53bba163e0f
        username: ${NACOS_ACCOUNT:nacos}
        password: ${NACOS_PASSWORD:nacos}
        shared-configs:
          - data-id: shared-routes.yaml
            refresh: true
          - data-id: shared-rabbitmq.yaml
            refresh: true
      discovery:
        enabled: true
        server-addr: localhost:6848
        namespace: 3c085602-c7a2-4095-8ca3-c53bba163e0f
        group: DEFAULT_GROUP
        username: ${NACOS_ACCOUNT:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - http://localhost
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      default-filters:
        - StripPrefix=2

# knife4j 网关聚合配置
knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3
      excluded-services:
        - gateway-service







