universe-life:
  auth:
    enable: true
    exclude-path:
      - /api/user/register
      - /api/auth/employee/login/password
      - /api/auth/employee/login/captcha
      - /api/common/captcha/send
      - /api/common/captcha/verify
      - /api/auth/oauth2-jwk/update
      - /api/auth/v3/api-docs
      - /api/user/v3/api-docs
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /doc.html
      - /favicon.ico
      - /actuator/health
      - /actuator/info
  security:
    resource:
      server:
        issuer-uri: http://localhost:8099

logging:
  level:
    org.springframework.amqp: INFO
    com.rabbitmq.client: INFO
    com.universe.life.gateway: DEBUG
#    com.github.xiaoymin.knife4j: DEBUG
#    org.springframework.security: DEBUG
