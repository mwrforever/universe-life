universe-life:
  auth:
    enable: true
    exclude-path:
      - /api/auth/user/login
      - /api/auth/user/register
      - /api/auth/admin/login
      - /api/auth/admin/register
      - /api/v3/api-docs/**
      - /api/swagger-ui/**
      - /api/doc.html
      - /actuator/health
      - /actuator/info
  security:
    resource:
      server:
        issuer-uri: http://localhost:8099

logging:
  level:
    org.springframework.amqp: INFO
    com.rabbitmq.client: INFO
    com.universe.life.gateway: DEBUG