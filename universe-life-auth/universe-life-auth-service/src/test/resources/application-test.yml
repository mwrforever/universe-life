# 测试环境配置
server:
  port: 0 # 随机端口

spring:
  profiles:
    active: test

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/universe_life_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 1  # 使用独立的测试数据库
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop  # 测试完成后清理
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 安全配置
universe:
  security:
    rate-limit:
      login-attempts: 5
      time-window-seconds: 60
      captcha-requests: 3
      captcha-time-window-seconds: 300
    brute-force-protection:
      max-attempts: 5
      lockout-duration-minutes: 30
      enabled: true

# 日志配置
logging:
  level:
    com.universe.life: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.testcontainers: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"

# 测试特定配置
test:
  containers:
    reuse: true