server:
  port: 8080

spring:
  application:
    name: universe-life-auth-service
  profiles:
    active: dev

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/universe_life_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Nacos配置
  cloud:
    nacos:
      discovery:
        server-addr: localhost:6848
        namespace: a40a1d4b-4110-45e7-b16d-dc842e7ba324
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        server-addr: localhost:6848
        namespace: a40a1d4b-4110-45e7-b16d-dc842e7ba324
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
        file-extension: yml
        shared-configs:
          - data-id: shared-logging.yaml
            group: DEFAULT_GROUP
            refresh: true

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.universe.life.auth.service.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Spring Security OAuth2 授权服务器配置
spring:
  security:
    oauth2:
      authorizationserver:
        issuer: ${AUTH_SERVER_URL:http://localhost:8080}
        # 可选：如果需要自定义端点路径，取消注释
        # authorization-endpoint: /oauth2/authorize
        # token-endpoint: /oauth2/token
        # jwk-set-url: /oauth2/jwks
        # device-authorization-endpoint: /oauth2/device_authorization
        # device-verification-endpoint: /oauth2/device_verification

# 日志配置
logging:
  level:
    com.universe.life.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG