# 生产环境配置 - Universe Life 授权服务器
# 使用方式: java -jar universe-life-auth-service.jar --spring.profiles.active=production

# ===== 服务器配置 =====
server:
  # 服务监听端口 - 生产环境可使用8080或其他指定端口
  port: 8080

  # HTTPS安全配置 - 生产环境强烈建议启用SSL
  ssl:
    # SSL启用开关，可通过环境变量SSL_ENABLED控制
    enabled: ${SSL_ENABLED:false}
    # SSL证书存储路径，需提供PKCS12格式证书文件
    key-store: ${SSL_KEY_STORE_PATH:}
    # SSL证书密码，建议使用环境变量存储
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    # SSL证书类型，默认PKCS12
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}

  # HTTP响应压缩配置 - 减少网络传输，提升性能
  compression:
    enabled: true
    # 支持压缩的MIME类型
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    # 最小响应大小阈值（字节），小于此值不压缩
    min-response-size: 1024

# ===== Spring框架核心配置 =====
spring:
  # 应用基本信息
  application:
    # 应用名称，用于服务注册和配置管理
    name: universe-life-auth-service

  # 激活的Spring Profile
  profiles:
    active: production

  # ===== 数据库配置 =====
  # JDBC数据源配置 - 连接MySQL生产数据库
  datasource:
    # MySQL驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接URL，包含Unicode支持、SSL配置和时区设置
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/universe_life_auth?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    # 数据库用户名，生产环境建议使用专用账户
    username: ${DATABASE_USERNAME:root}
    # 数据库密码，必须通过环境变量设置
    password: ${DATABASE_PASSWORD:123456}

    # HikariCP连接池配置 - 高性能JDBC连接池
    hikari:
      # 最小空闲连接数
      minimum-idle: 10
      # 最大连接池大小
      maximum-pool-size: 50
      # 空闲连接超时时间（毫秒）
      idle-timeout: 300000
      # 连接最大生命周期（毫秒）
      max-lifetime: 1800000
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 连接测试查询SQL
      connection-test-query: SELECT 1
      # 连接泄漏检测阈值（毫秒）
      leak-detection-threshold: 60000

  # ===== Redis缓存配置 =====
  # Redis数据源配置 - 用于JWT令牌存储和会话缓存
  data:
    redis:
      # Redis服务器地址
      host: ${REDIS_HOST:localhost}
      # Redis服务器端口
      port: ${REDIS_PORT:6379}
      # Redis认证密码，生产环境必须设置
      password: ${REDIS_PASSWORD:}
      # Redis数据库索引（0-15）
      database: ${REDIS_DATABASE:0}
      # 连接超时时间
      timeout: 6000ms

      # Lettuce连接池配置
      lettuce:
        pool:
          # 最大活跃连接数
          max-active: 50
          # 连接池最大等待时间，-1表示无限等待
          max-wait: -1ms
          # 最大空闲连接数
          max-idle: 20
          # 最小空闲连接数
          min-idle: 5

  # ===== Nacos服务发现与配置中心 =====
  cloud:
    nacos:
      # 服务注册发现配置
      discovery:
        # Nacos服务器地址
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
        # Nacos命名空间ID，生产环境使用专用命名空间
        namespace: ${NACOS_NAMESPACE:production}
        # 配置分组
        group: DEFAULT_GROUP
        # Nacos认证用户名
        username: ${NACOS_USERNAME:nacos}
        # Nacos认证密码
        password: ${NACOS_PASSWORD:nacos}
        # 服务元数据
        metadata:
          version: 1.0.0
          zone: production

      # 配置中心配置
      config:
        # Nacos服务器地址（与discovery保持一致）
        server-addr: ${NACOS_SERVER_ADDR:nacos-server:8848}
        # 命名空间（与discovery保持一致）
        namespace: ${NACOS_NAMESPACE:production}
        # 配置分组
        group: DEFAULT_GROUP
        # 认证信息
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 配置文件格式
        file-extension: yml

        # 共享配置文件列表
        shared-configs:
          # 生产环境日志配置
          - data-id: shared-logging-production.yaml
            group: DEFAULT_GROUP
            refresh: true
          # 监控配置
          - data-id: shared-monitoring.yaml
            group: DEFAULT_GROUP
            refresh: true

  # ===== Spring Security OAuth2 授权服务器配置 =====
  # 注意：以下配置已更新为Spring Boot 3.x兼容格式
  security:
    oauth2:
      # 授权服务器配置
      authorizationserver:
        # 发行者URI - 授权服务器的唯一标识，必须使用HTTPS
        issuer: ${AUTH_SERVER_URL:https://auth.yourdomain.com}

        # 以下端点配置已更新为新的配置路径
        # 注意：在Spring Boot 3.x中，这些端点会自动注册，无需手动配置
        # 授权码端点 - 用户授权确认页面
        # authorization-endpoint: ${AUTH_ENDPOINT:/oauth2/authorize}

        # 令牌端点 - 客户端获取访问令牌
        # token-endpoint: ${TOKEN_ENDPOINT:/oauth2/token}

        # JWK集合端点 - 提供公钥用于令牌验证
        # jwk-set-url: ${JWK_SET_URL:/oauth2/jwks}

        # 令牌内省端点 - 验证令牌有效性
        # token-introspection-endpoint: ${INTROSPECTION_ENDPOINT:/oauth2/introspect}

        # 令牌撤销端点 - 撤销已发放的令牌
        # token-revocation-endpoint: ${REVOCATION_ENDPOINT:/oauth2/revoke}

        # OIDC相关配置已简化
        # 注意：oidc配置在Spring Boot 3.x中已集成到authorizationserver中
        # 客户端注册端点 - 动态注册OIDC客户端（自动生成）
        # client-registration-endpoint: /connect/register

        # 登出端点 - OIDC单点登出（自动生成）
        # logout-endpoint: /connect/logout

# ===== 自定义授权配置 =====
# 应用自定义的OAuth2客户端配置
auth:
  clients:
    # API网关客户端配置
    gateway:
      # 客户端ID - 网关服务的唯一标识
      id: ${GATEWAY_CLIENT_ID:universe-life-gateway}
      # 客户端密钥 - 生产环境必须设置强密钥
      secret: ${GATEWAY_CLIENT_SECRET:}
      # 重定向URI - OAuth2授权码回调地址
      redirect-uri: ${GATEWAY_REDIRECT_URI:https://gateway.yourdomain.com/login/oauth2/code/gateway}

# ===== MyBatis Plus持久层配置 =====
# 数据访问层ORM框架配置
mybatis-plus:
  # Mapper XML文件位置
  mapper-locations: classpath*:mapper/*.xml
  # 实体类别名包路径
  type-aliases-package: com.universe.life.auth.service.domain

  # MyBatis核心配置
  configuration:
    # 开启下划线转驼峰命名
    map-underscore-to-camel-case: true
    # 关闭二级缓存
    cache-enabled: false
    # 当查询结果为null时调用setter方法
    call-setters-on-nulls: true
    # JDBC类型为null的处理方式
    jdbc-type-for-null: 'null'

  # 全局配置
  global-config:
    # 数据库配置
    db-config:
      # 主键生成策略：雪花算法
      id-type: ASSIGN_ID
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值（已删除）
      logic-delete-value: 1
      # 逻辑未删除值（正常）
      logic-not-delete-value: 0

# ===== Spring Boot Actuator监控配置 =====
# 生产环境应用监控和管理端点配置
management:
  # Web端点配置
  endpoints:
    web:
      # 暴露的端点列表 - 生产环境按需开启
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      # 端点基础路径
      base-path: /actuator

  # 具体端点配置
  endpoint:
    # 健康检查端点
    health:
      # 健康详情显示权限
      show-details: when-authorized
      # 显示组件详情
      show-components: always

    # 指标端点
    metrics:
      enabled: true

    # Prometheus指标端点
    prometheus:
      enabled: true

  # 指标收集配置
  metrics:
    # 注意：已移除弃用的prometheus.enabled和simple.enabled配置
    # 原配置：export.prometheus.enabled和export.simple.enabled在新版本中已弃用
    # 现在自动使用Micrometer内置的指标收集，无需手动启用export

    # 分布式统计配置
    distribution:
      # HTTP请求百分位直方图
      percentiles-histogram:
        http.server.requests: true
      # HTTP请求百分位数配置
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99

    # 指标标签
    tags:
      # 应用名称标签
      application: ${spring.application.name}
      # 环境标签
      environment: production

# ===== 日志配置 =====
# 生产环境日志输出配置
logging:
  # 日志级别配置
  level:
    # 根日志级别
    root: INFO
    # 应用日志级别
    com.universe.life.auth: INFO
    # Spring Security日志级别
    org.springframework.security: WARN
    # OAuth2日志级别
    org.springframework.security.oauth2: WARN
    # Spring Web日志级别
    org.springframework.web: WARN

  # 日志输出格式配置
  pattern:
    # 控制台日志格式 - 包含时间、线程、级别、链路追踪信息
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{50} - %msg%n"
    # 文件日志格式 - 与控制台格式一致
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{50} - %msg%n"

  # 日志文件配置
  file:
    # 日志文件路径 - 生产环境建议使用专门的日志目录
    name: ${LOG_FILE_PATH:/var/log/universe-life/auth-service.log}

  # Logback滚动策略配置
  logback:
    rollingpolicy:
      # 单个日志文件最大大小
      max-file-size: 100MB
      # 保留的日志文件数量
      max-history: 30
      # 日志文件总大小上限
      total-size-cap: 1GB

# ===== 生产环境JVM优化建议 =====
# 以下JVM参数可根据实际部署环境调整：

# 堆内存配置 - 根据服务器内存和应用负载调整
# -Xms2g -Xmx4g

# 垃圾回收器配置 - 推荐使用G1GC
# -XX:+UseG1GC

# GC性能优化
# -XX:MaxGCPauseMillis=200
# -XX:+UseStringDeduplication
# -XX:+OptimizeStringConcat

# 系统属性配置
# -Dspring.profiles.active=production
# -Dfile.encoding=UTF-8
# -Duser.timezone=Asia/Shanghai

# 监控和诊断配置
# -XX:+HeapDumpOnOutOfMemoryError
# -XX:HeapDumpPath=/var/log/universe-life/heapdump.hprof
# -XX:+PrintGCDetails
# -XX:+PrintGCTimeStamps
# -Xloggc:/var/log/universe-life/gc.log