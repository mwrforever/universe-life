universe-life:
  datasource:
    host: 43.142.103.248
    port: 3306
    username: root
    password: 1010520mao
    database: universe_life_message
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: 0
      host: 43.142.103.248
      port: 6379
      password: 1010520mao
      timeout: 10000
    mongodb:
      host: 43.142.103.248
      port: 27017
      database: universe_life_message
      username: root
      password: 1010520mao
      authentication-database: admin

spring:
  data:
    mongodb:
      uri: mongodb://root:1010520mao@43.142.103.248:27017/universe_life_message?authSource=admin
  kafka:
    bootstrap-servers: 43.142.103.248:9092
    consumer:
      group-id: message-service-group
      auto-offset-reset: earliest
      enable-auto-commit: true

# 聊天系统配置
chat:
  snowflake:
    worker-id: 1
    datacenter-id: 1
  encryption:
    secret-key: universe-life-chat-secret-key-2026
  # 离线消息配置
  offline:
    expire-days: 7
    max-count: 1000
  # 幂等处理配置
  idempotent:
    expire-hours: 24
  # Redisson 分布式锁配置（测试环境）
  redisson:
    # 基础配置
    password: 1010520mao
    connection-pool-size: 30
    connect-timeout: 8000
    timeout: 2500
    retry-attempts: 2
    retry-interval: 1000
    read-mode: MASTER
    subscription-mode: MASTER

    # 单机模式配置（测试环境推荐）
    single:
      enabled: true
      address: redis://43.142.103.248:6379
      database: 0
  mybatis-plus:
    type-aliases-package: com.universe.life.message.domain

auth:
  enable: true
  exclude-path:
    - /actuator/health
    - /actuator/info
    - /swagger-ui/**
    - /doc.html
    - /favicon.ico
    - /v3/api-docs
    - /webjars/**
    - /v3/api-docs/**

logging:
  level:
    org.springframework.amqp: INFO
    com.rabbitmq.client: INFO
    com.universe.life.message: DEBUG


# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
