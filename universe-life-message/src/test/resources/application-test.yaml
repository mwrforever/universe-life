# Test Configuration for Message Service
spring:
  application:
    name: universe-life-message-test

  # MongoDB - will be overridden by Testcontainers
  data:
    mongodb:
      uri: mongodb://localhost:27017/test

  # Redis - mock or embedded for tests
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka - disabled for unit tests
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest

  # Disable Nacos for tests
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# Disable auth for tests
auth:
  enable: false

# Message encryption key for tests
chat:
  message:
    encryption:
      key: test-encryption-key-32bytes!!

# Logging
logging:
  level:
    com.universe.life.message: DEBUG
    org.springframework.data.mongodb: DEBUG
